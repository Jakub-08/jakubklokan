<!-- Základ -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>{{ page.title | default: site.title }}</title>

<meta
  name="description"
  content="{{ page.description | default: site.description }}"
/>

<meta name="author" content="{{ site.author }}" />

<!-- Favicon -->
<link rel="icon" href="/favicon.png" type="image/png" />
<link rel="shortcut icon" href="/favicon.ico" />

<!-- Fonts + ikony -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<link
  href="https://fonts.googleapis.com/css2?family=Inter&display=swap"
  rel="stylesheet"
/>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
/>

<!-- CSS -->
<link rel="stylesheet" href="{{ '/assets/css/variables.css' | relative_url }}" />
<link rel="stylesheet" href="{{ '/assets/css/base.css' | relative_url }}" />
<link rel="stylesheet" href="{{ '/assets/css/layout.css' | relative_url }}" />
<link rel="stylesheet" href="{{ '/assets/css/components.css' | relative_url }}" />

<!-- Page-specific CSS -->
<link rel="stylesheet" href="{{ '/assets/css/pages/homepage.css' | relative_url }}" />
<link rel="stylesheet" href="{{ '/assets/css/pages/about_me.css' | relative_url }}" />
<link rel="stylesheet" href="{{ '/assets/css/pages/achievements.css' | relative_url }}" />
<link rel="stylesheet" href="{{ '/assets/css/pages/sponzoring.css' | relative_url }}" />
<link rel="stylesheet" href="{{ '/assets/css/pages/photo_gallery.css' | relative_url }}" />
<link rel="stylesheet" href="{{ '/assets/css/pages/blog_index.css' | relative_url }}" />
<link rel="stylesheet" href="{{ '/assets/css/pages/blog_articles.css' | relative_url }}" />

{% assign canonical_url = site.url | append: page.url | replace:'index.html','' %}

<script src="/assets/js/header-scroll.js" defer></script>

<!-- Canonical URL -->
<link rel="canonical" href="{{ canonical_url }}" />

<!-- Open Graph -->
<meta property="og:title" content="{{ page.title | default: site.title }}" />
<meta property="og:description" content="{{ page.description | default: site.description }}" />
<meta property="og:image" content="{{ page.og_image | default: site.og_image }}" />
<meta property="og:url" content="{{ canonical_url }}" />
<meta property="og:type" content="website" />

<meta name="robots" content="index, follow" />

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ page.title | default: site.title }}" />
<meta name="twitter:description" content="{{ page.description | default: site.description }}" />
<meta name="twitter:image" content="{{ page.og_image | default: site.og_image }}" />

<!-- Schema.org -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Jakub Klokan",
  "url": "{{ site.url }}",
  "image": "{{ site.og_image }}",
  "jobTitle": "Badminton player",
  "description": "Český badmintonista zaměřený na mezinárodní turnaje a sportovní rozvoj.",
  "nationality": "Czech",
  "sameAs": [
    "{{ site.social.instagram }}",
    "{{ site.social.facebook }}"
  ]
}
</script>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NCZN4K2E8L"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-NCZN4K2E8L');
</script>
