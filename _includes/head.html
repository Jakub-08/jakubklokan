<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ page.title | default: site.title }}</title>
<meta
  name="description"
  content="{{ page.description | default: site.description }}"
/>
<meta name="author" content="{{ site.author }}" />
<html lang="{{ site.lang }}"></html>

<link rel="icon" href="{{ site.logo }}" type="image/svg+xml" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter&display=swap"
/>
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
/>

<link
  rel="stylesheet"
  href="{{ '/assets/css/variables.css' | relative_url }}"
/>
<link rel="stylesheet" href="{{ '/assets/css/base.css' | relative_url }}" />
<link rel="stylesheet" href="{{ '/assets/css/layout.css' | relative_url }}" />
<link
  rel="stylesheet"
  href="{{ '/assets/css/components.css' | relative_url }}"
/>
<link
  rel="stylesheet"
  href="{{ '/assets/css/pages/homepage.css' | relative_url }}"
/>

<!-- OpenGraph -->
<meta property="og:title" content="{{ page.title | default: site.title }}" />
<meta
  property="og:description"
  content="{{ page.description | default: site.description }}"
/>
<meta
  property="og:image"
  content="{{ page.og_image | default: site.og_image }}"
/>
<meta property="og:url" content="{{ site.url }}" />
<meta property="og:type" content="website" />

<!-- Schema.org -->
<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ site.author }}",
    "url": "{{ site.url }}",
    "logo": "{{ site.og_image }}",
    "sameAs": ["{{ site.social.instagram }}"]
  }
</script>

<!-- Google Analytics -->
<script
  async
  src="https://www.googletagmanager.com/gtag/js?id=G-NCZN4K2E8L"
></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() {
    dataLayer.push(arguments);
  }
  gtag("js", new Date());
  gtag("config", "G-NCZN4K2E8L");
</script>
